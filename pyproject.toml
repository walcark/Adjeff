[project]
name = "adjeff"
version = "0.13.2"
authors = [{ name = "walcark", email = "kevin.walcarius@gmail.com" }]
readme = "README.md"
description = "Library that provides utilities to simulate adjacency effects."
requires-python = ">=3.11,<3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
# smartg, luts, geoclide are conda-forge only — install via pixi or conda.
dependencies = [
  "pydantic>=2.12.5",
  "xarray>=2026.1.0",
  "numpy>=2.0.0",
  "structlog>=24.0.0",
  "joblib>=1.3.0",
  "zarr>=3.0.0",
  "dask>=2024.1.0",
  "rasterio>=1.3.0",
  "tqdm>=4.0.0",
  "torch>=2.0.0",
  "scipy>=1.10.0",
  "xsweep>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/walcark/Adjeff"
Issues = "https://github.com/walcark/Adjeff/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling >= 1.26"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
adjeff = { path = ".", editable = true }
xsweep = ">=0.4.0"
scienceplots = ">=2.0"
sensorsio = "*"

[tool.pixi.dependencies]
python = ">=3.11,<3.13"
pydantic = ">=2.12.5,<3"
smartg = ">=1.2.0,<2"
# smartg 1.2.0 calls geoclide's `get_rotateX_tf`, which geoclide 4.0.0
# renamed to `get_rotate_x_tf`.  Only the PSF sampler reaches that code
# path, so the break is invisible until `PsfAtmSampler` runs.  Lift this
# bound once smartg ships a release built against geoclide 4.
geoclide = ">=3,<4"
luts = ">=1.0.6,<2"
xarray = ">=2026.1.0,<2027"
numpy = ">=2.4.2,<3"
structlog = ">=25.5.0,<26"
pip = ">=26.0.1,<27"
joblib = ">=1.5.3,<2"
zarr = ">=3.1.5,<4"
dask = ">=2026.3.0,<2027"
rasterio = ">=1.4.3,<2"
tqdm = ">=4.67.3,<5"
scipy = ">=1.14.0,<2"

[tool.pixi.feature.gpu]
# CUDA >= 12.8 is required: nvcc only learns `sm_120` (Blackwell, RTX 50xx)
# there, and Smart-G compiles its kernels for the local compute capability.
# pixi 0.77 deprecates this table in favour of a constraint on the
# `platforms` entries, but that form is only accepted at workspace level,
# where it would force CUDA on the `cpu` environment as well.  Kept until
# pixi accepts a per-feature platform constraint.
system-requirements = { cuda = "12.9" }
dependencies = { cuda-version = "12.9.*", pytorch-gpu = "*", cuda-cudart-dev = "12.9.*", cuda-nvcc = "12.9.*" }

[tool.pixi.feature.cpu]
dependencies = { pytorch-cpu = "*" }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=6.0"
ruff = ">=0.11"
pre-commit = ">=4.2"
mypy = ">=1.5"
nbsphinx = ">=0.9"

[tool.pixi.feature.notebooks.dependencies]
jupyterlab = ">=4.0"
matplotlib = ">=3.9"
ipywidgets = ">=8.0"

[tool.pixi.environments]
cpu = ["cpu"]
gpu = ["gpu"]
dev = ["dev", "cpu"]
dev-gpu = ["dev", "gpu"]
notebooks = ["notebooks", "cpu"]
notebooks-gpu = ["notebooks", "gpu"]
builder = ["builder"]

[tool.pixi.feature.dev.tasks]
fmt = { cmd = "ruff format ." }
lint = { cmd = "ruff check" }
type-check = { cmd = "mypy src/adjeff --strict" }
test = { cmd = "pytest tests/ --cov" }
# Integration tests drive Smart-G on the GPU: minutes, not seconds, and
# impossible on a CI runner without CUDA.  They are excluded from `test`
# by the `addopts` below and only run through this task.
test-integration = { cmd = "pytest tests/ -m integration -v" }
all = { depends-on = ["fmt", "lint", "type-check", "test"] }
install-sphinx = { cmd = "python -m pip install --upgrade sphinx pydata-sphinx-theme nbsphinx nbsphinx-link" }
build-doc = { cmd = "sphinx-build -b html source build/html", cwd = "docs" }

[tool.pixi.feature.builder.tasks]
install-build = { cmd = "python -m pip install --upgrade build twine" }
build = { cmd = "python -m build" }
upload-testpypi = { cmd = "python -m twine upload --repository testpypi dist/*" }

[tool.pytest.ini_options]
# `-m "not integration"` is what keeps the GPU tests out of CI: the
# default run, and therefore `pixi run test`, never selects them.  The
# tests also carry `requires_cuda`, so forcing them on a machine without
# a GPU skips rather than fails.
addopts = "-m 'not integration'"
markers = [
  "integration: drives Smart-G on a CUDA GPU; excluded from the default run",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "smartg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rasterio.*"
ignore_missing_imports = true

[tool.ruff]
fix = true
line-length = 88
indent-width = 4
exclude = ["docs/*", "scripts/*", "test.py", "notebooks/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
fixable = ["ALL"]
unfixable = []
pydocstyle = { convention = "numpy" }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
