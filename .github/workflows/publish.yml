name: Publish to PyPI

# Pushing an annotated tag is the whole release ceremony: this workflow
# checks that the tag agrees with the project version, builds, publishes
# to PyPI, then opens the GitHub release.  Creating the release by hand
# first is no longer needed.
on:
  push:
    tags: ["v*"]

jobs:

  check-version:
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Tag must match the project version
      run: |
        version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match" \
               "pyproject version $version" >&2
          exit 1
        fi
        echo "tag $GITHUB_REF_NAME matches version $version"

  build-and-publish:

    needs: check-version
    runs-on: ubuntu-latest

    environment: pypi

    permissions:
      id-token: write
      contents: write

    steps:

    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Load Pixi
      uses: prefix-dev/setup-pixi@v0.9.4
      with:
        pixi-version: v0.65.0
        cache: true
        environments: builder

    - name: Install build
      run: pixi run -e builder install-build

    - name: Build project
      run: pixi run -e builder build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        package-dir: dist

    - name: Create the GitHub release
      run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
      env:
        GH_TOKEN: ${{ github.token }}
